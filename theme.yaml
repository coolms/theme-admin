slug: coolms-admin
name: CoolMS Admin SPA
version: 2.0.0-alpha6
author: CoolMS Team
description: Angular administration panel for CoolMS 2.0
feStack: spa
spaFramework: angular
license: MIT
# The host contracts this theme implements, name -> MAJOR.MINOR (the platform
# rule: hosts implement contracts, modules offer entries). Read by three
# things, or it is a placeholder: the build
# (angular/scripts/assemble-console.mjs refuses when core-angular's contract
# differs), the installer (coolms:theme:install / activate and coolms:install
# refuse a module whose range this version does not meet), and the app-config
# manifest (`ui.contracts`, `ui.modules`), which is what activates a module.
contracts:
  console: "1.0"

# The person's settings for this host, section `console`: what a person may keep on the server for the admin.
settings:
  sidebarCollapsed:
    type: boolean
    default: false
    label: Collapse the sidebar
  pageSize:
    type: integer
    default: 50
    label: Rows loaded at a time
    min: 10
    max: 200
  viewMode:
    type: choice
    default: page
    label: Default view
    choices: [page, list, tiles]
