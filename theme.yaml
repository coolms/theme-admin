slug: coolms-admin
name: CoolMS Admin SPA
version: 2.0.0-alpha2
author: CoolMS Team
description: Angular administration panel for CoolMS 2.0
feStack: spa
spaFramework: angular
license: MIT
# The host contracts this theme implements, name -> MAJOR.MINOR (ADR-194,
# decision 6). Read by three things, or it is a placeholder: the build
# (angular/scripts/assemble-console.mjs refuses when core-angular's contract
# differs), the installer (coolms:theme:install / activate and coolms:install
# refuse a module whose range this version does not meet), and the app-config
# manifest (`ui.contracts`, `ui.modules`), which is what activates a module.
contracts:
  console: "1.0"
