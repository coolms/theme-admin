name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # Weekly, so a break from a dependency or a PHP point release shows up on a
  # Monday rather than inside someone's pull request.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  install:
    name: PHP ${{ matrix.php }} ${{ matrix.deps }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
        # --prefer-lowest is not padding. The constraints in composer.json are
        # a promise about what this works with, and installing the floor of
        # every range is the only thing that tests the promise. This package
        # shipped for weeks with an undeclared dependency that the blanket
        # application requirement was hiding; an install-based check is what
        # finds that class of defect.
        deps: ['highest', 'lowest']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: none, ctype, dom, filter, json, libxml, mbstring, tokenizer, xml, xmlwriter, curl, phar

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ matrix.deps }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.deps }}-

      # The siblings this package requires at ^2.0 are not tagged yet -- the
      # generation ships as 2.0.0-alpha.N first. Their branch carries a
      # branch-alias, so relaxing stability HERE -- never in the published
      # manifest, and only after validate has seen the real one -- lets the
      # resolve succeed. Without it the install fails and every step behind it
      # is SKIPPED, so a red check would say nothing about the package.
      - name: Allow the untagged generation branch of siblings
        run: |
          composer config minimum-stability dev
          composer config prefer-stable true

      # ⚠️ CI ONLY, and it must stay that way. The published manifest names
      # the package and nothing else -- a `repositories` entry in
      # composer.json would be inherited by every consumer, who would then
      # be fetching a peer from a URL they never chose. The moment
      # coolms/document-engine is submitted to Packagist this line stops
      # mattering and should be deleted.
      - name: Resolve the peer that is not on Packagist yet
        run: composer config repositories.document-engine vcs https://github.com/coolms/document-engine

      - name: Install dependencies
        run: |
          if [ "${{ matrix.deps }}" = 'lowest' ]; then
            composer update --prefer-lowest --prefer-dist --no-interaction --no-progress
          else
            composer update --prefer-dist --no-interaction --no-progress
          fi

      - name: Lint sources
        run: find src -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Run tests
        run: vendor/bin/phpunit

  boundary:
    name: No application code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A theme is a package, not part of the application. The contracts it
      # implements were moved into coolms/core precisely so that is true, and
      # this asserts it rather than trusting it: a single `use App\...` added
      # later would compile fine here and break only for a consumer.
      - name: Assert nothing references an application namespace
        run: |
          if grep -rnE '\bApp\\+[A-Z]' src/ ; then
            echo "::error::src/ references an application namespace"
            exit 1
          fi
          echo "confirmed: no application namespace in src/"
